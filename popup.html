<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CHATLY</title>
<style>
:root{
--bg:#09090b;
--card:#18181b;
--text:#f8fafc;
--muted:#a1a1aa;
--primary:#8b5cf6;
--secondary:#06b6d4;
--danger:#fb7185;
--border:rgba(255,255,255,.08);
}
*{
box-sizing:border-box;
}
body{
width:340px;
margin:0;
padding:10px;
font-family:"Inter","Segoe UI",sans-serif;
background:linear-gradient(145deg,#09090b,#111827);
color:var(--text);
}
/* HEADER */
.header{
margin-bottom:10px;
}
.brand-title{
display:flex;
align-items:center;
gap:8px;
margin:0;
font-size:17px;
font-weight:700;
background:linear-gradient(
90deg,
#ffffff,
#a5b4fc
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.chatly-logo{
width:22px;
height:22px;
object-fit:contain;
-webkit-text-fill-color:initial; /* Fix for gradient text overlap */
}
.subtitle{
font-size:10px;
color:var(--muted);
margin-top:2px;
}
/* CONTAINERS */
.card,
.card-full{
background:rgba(255,255,255,.05);
border:1px solid var(--border);
border-radius:12px;
padding:10px;
backdrop-filter:blur(10px);
transition:.25s ease;
}
.card:hover,
.card-full:hover{
transform:translateY(-1px);
background:rgba(255,255,255,.08);
}
.grid-row{
display:flex;
gap:8px;
margin-bottom:8px;
}
.card{
flex:1;
display:flex;
flex-direction:column;
justify-content:space-between;
}
label{
font-size:9px;
font-weight:700;
letter-spacing:.5px;
color:var(--muted);
text-transform:uppercase;
}
/* INPUTS */
input,
select,
button{
width:100%;
margin-top:5px;
padding:7px 8px;
border-radius:6px;
border:1px solid var(--border);
font-size:11px;
outline:none;
}
input,
select{
background:#09090b;
color:white;
}
input:focus,
select:focus{
border-color:var(--primary);
box-shadow:
0 0 0 2px rgba(139,92,246,.2);
}
/* BUTTONS */
button{
background:
linear-gradient(
135deg,
var(--primary),
var(--secondary)
);
color:white;
border:none;
font-weight:700;
cursor:pointer;
transition:.2s ease;
}
button:hover{
transform:scale(1.02);
box-shadow:
0 0 12px rgba(139,92,246,.4);
}
.btn-secondary{
background:#27272a;
color:white;
}
.btn-secondary:hover{
background:#3f3f46;
}
.btn-danger{
background:rgba(251,113,133,.15);
color:#fb7185;
border:
1px solid rgba(251,113,133,.3);
}
.btn-danger:hover{
background:#fb7185;
color:white;
}
/* SAVED LOGS */
#savedList{
height:55px;
overflow-y:auto;
padding:6px;
border-radius:7px;
background:#09090b;
font-size:10px;
color:var(--muted);
}
.small-gap{
margin-top:5px;
}
/* AI SEARCH */
.search-container{
position:relative;
}
#aiSuggestionsList{
position:absolute;
top:100%;
left:0;
right:0;
background:#18181b;
border:1px solid var(--border);
border-radius:7px;
overflow:hidden;
z-index:20;
}
.dd-item{
padding:6px;
font-size:11px;
cursor:pointer;
border-bottom:
1px solid var(--border);
}
.dd-item:hover{
background:#27272a;
color:#a78bfa;
}
/* SCROLL */
::-webkit-scrollbar{
width:3px;
}
::-webkit-scrollbar-thumb{
background:#3f3f46;
border-radius:10px;
}
</style>
</head>
<body>
<div class="header">
<h2 class="brand-title">
<img src="icon.png" alt="Logo" class="chatly-logo"> CHATLY
</h2>
<div class="subtitle">
AI Conversation Memory Vault
</div>
</div>
<div class="grid-row">
<div class="card">
<div>
<label>
Current Chat
</label>
<p style="font-size:10px;color:var(--muted);margin:3px 0 6px;">Capture active AI conversation</p>
</div>
<button id="saveBtn">Save Chat</button>
</div>
<div class="card">
<label>
History / Export
</label>
<select id="savedChatSelect">
</select>
<div style="display:flex;gap:4px;margin-top:4px;">
<select id="formatSelect"style="width:65px">
<option value="txt">.txt</option>
<option value="json">
.json
</option>
<option value="md">
.md
</option>
</select>
<button id="downloadBtn"
class="btn-secondary">
Export
</button>
</div>
</div>
</div>
<div class="card-full">
<div style="
display:flex;
justify-content:space-between;
align-items:center;
">
<label>
Saved Logs
</label>
<button id="clearAllBtn"
class="btn-danger"
style="
width:auto;
padding:4px 7px;
font-size:9px;
">
Clear
</button>
</div>
<div id="savedList"
class="small-gap">
No saved chats yet.
</div>
</div>
<div class="card-full"
style="margin-top:8px;">
<label>
Switch AI Assistant
</label>
<div class="search-container">
<input
id="aiSearchInput"
placeholder="Search AI..."
autocomplete="off">
<div id="aiSuggestionsList"
hidden>
</div>
</div>
<button id="transferBtn"style="margin-top:6px;">Jump to AI 🚀</button></div>
<script src="providers.js"></script>
<script src="popup.js"></script>
</body>
</html>
